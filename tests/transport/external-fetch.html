<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pooya Labs — External GAS transport proof</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui;background:#090d16;color:#e8f0ff}
    body{max-width:820px;margin:36px auto;padding:0 18px}
    main{background:#111a29;border:1px solid #26364b;border-radius:18px;padding:22px}
    input{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #40536d;background:#080d16;color:#fff}
    button{margin-top:12px;padding:12px 16px;border:0;border-radius:9px;background:#00d5e8;color:#001018;font-weight:700}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070b12;padding:14px;border-radius:10px}
    .muted{color:#9aacc5}
  </style>
</head>
<body>
<main>
  <h1>External browser → GAS transport proof</h1>
  <p class="muted">Enter the deployed /exec URL. This sends a public, non-sensitive health request only. Do not enter a token or secret.</p>
  <label for="endpoint">Apps Script Web App URL</label>
  <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="url">
  <button id="run" type="button">Test text/plain POST</button>
  <pre id="result" aria-live="polite">Not tested yet.</pre>
</main>
<script>
const endpoint=document.getElementById('endpoint');
const result=document.getElementById('result');
document.getElementById('run').addEventListener('click',async()=>{
  const url=endpoint.value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){
    result.textContent='Enter a valid Apps Script /exec URL.';return;
  }
  const request={apiVersion:1,requestId:crypto.randomUUID(),action:'health.check',payload:{}};
  result.textContent='Sending request…';
  const started=performance.now();
  try{
    const response=await fetch(url,{
      method:'POST',
      mode:'cors',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(request)
    });
    const body=await response.text();
    result.textContent=JSON.stringify({
      ok:response.ok,status:response.status,finalUrl:response.url,
      redirected:response.redirected,elapsedMs:Math.round(performance.now()-started),
      responseHeaders:{contentType:response.headers.get('content-type')},
      body:body.slice(0,2000)
    },null,2);
  }catch(error){
    result.textContent=JSON.stringify({
      ok:false,error:String(error),elapsedMs:Math.round(performance.now()-started),
      note:'A browser TypeError may indicate CORS or redirect response restrictions. Inspect DevTools Network and Console; do not label this a server outage without evidence.'
    },null,2);
  }
});
</script>
</body>
</html>
