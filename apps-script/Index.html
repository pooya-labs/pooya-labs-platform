<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pooya Labs — GAS RPC proof</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui;background:#090d16;color:#e8f0ff}
    body{max-width:760px;margin:40px auto;padding:0 20px}
    main{border:1px solid #26364b;border-radius:18px;padding:24px;background:#111a29}
    button{padding:12px 16px;border:0;border-radius:10px;background:#00d5e8;color:#001018;font-weight:700;cursor:pointer}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070b12;padding:14px;border-radius:10px}
    .muted{color:#9aacc5}
  </style>
</head>
<body>
  <main>
    <h1>Pooya Labs · GAS RPC proof</h1>
    <p class="muted">This page tests only the HtmlService → google.script.run transport. It does not test external CORS.</p>
    <button id="run" type="button">Run RPC health check</button>
    <pre id="result" aria-live="polite">Not tested yet.</pre>
  </main>
  <script>
    const button = document.getElementById('run');
    const result = document.getElementById('result');
    button.addEventListener('click', () => {
      result.textContent = 'Running…';
      button.disabled = true;
      google.script.run
        .withSuccessHandler(value => {
          result.textContent = JSON.stringify(value, null, 2);
          button.disabled = false;
        })
        .withFailureHandler(error => {
          result.textContent = 'RPC_ERROR: ' + (error && error.message ? error.message : String(error));
          button.disabled = false;
        })
        .rpcHealth();
    });
  </script>
</body>
</html>
