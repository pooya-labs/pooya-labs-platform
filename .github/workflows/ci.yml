name: Repository CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, three-target build, and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check platform
        run: npm run typecheck
      - name: Build GitHub Pages and Apps Script bundles
        run: npm run build
      - name: Build independent Cloudflare Pages bundle
        run: npm run build:cloudflare
      - name: Upload single-file Apps Script bundle
        uses: actions/upload-artifact@v7
        with:
          name: pooya-labs-gas-htmlservice-bundle
          path: dist/gas/index.html
          if-no-files-found: error
          retention-days: 14
      - name: Upload Cloudflare Pages bundle
        uses: actions/upload-artifact@v7
        with:
          name: pooya-labs-cloudflare-pages-bundle
          path: dist/cloudflare
          if-no-files-found: error
          retention-days: 14
      - name: Run repository contract tests
        run: npm test
