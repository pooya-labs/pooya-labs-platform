name: Publish Reviewed Interface Captures

on:
  push:
    branches: [main]
    paths:
      - 'docs/approved-interface-captures/*.json'
      - '.github/workflows/publish-reviewed-captures.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-reviewed-interface-captures
  cancel-in-progress: false

jobs:
  publish:
    name: Verify approval manifest and publish selected images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate approval manifest
        id: approval
        env:
          MANIFEST: docs/approved-interface-captures/orbit-2026-11-06.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const approval = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          if (approval.schemaVersion !== 1 || approval.project !== 'orbit') {
            throw new Error('Unsupported approval manifest or project scope.');
          }
          if (approval.review?.outcome !== 'approved-for-portfolio-use') {
            throw new Error('The approval manifest does not authorize publication.');
          }
          if (!Number.isInteger(approval.artifact?.workflowRunId) || !/^[a-f0-9]{40}$/.test(approval.artifact.captureSha)) {
            throw new Error('The source capture run or SHA is invalid.');
          }
          if (approval.files?.length !== 2) {
            throw new Error('Exactly two reviewed ORBIT viewport captures are required.');
          }
          const expected = new Set([
            'apps/platform/public/interface-captures/orbit/orbit-desktop.png',
            'apps/platform/public/interface-captures/orbit/orbit-mobile.png',
          ]);
          const seen = new Set();
          for (const file of approval.files) {
            if (!expected.has(file.destination) || seen.has(file.destination)) {
              throw new Error('Unexpected or duplicate destination in approval manifest.');
            }
            if (!/^[a-f0-9]{64}$/.test(file.sha256) || !Number.isInteger(file.bytes) || file.bytes <= 8) {
              throw new Error('Invalid file integrity metadata.');
            }
            if (!['orbit-desktop.png', 'orbit-mobile.png'].includes(file.source)) {
              throw new Error('Unexpected source filename.');
            }
            seen.add(file.destination);
          }
          if (seen.size !== expected.size) {
            throw new Error('Both desktop and mobile captures must be approved.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${approval.artifact.workflowRunId}\nartifact_name=${approval.artifact.name}\n`);
          NODE

      - name: Download the exact reviewed screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ steps.approval.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.approval.outputs.artifact_name }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/interface-captures"

      - name: Verify PNG signatures, sizes, and SHA-256 checksums
        env:
          MANIFEST: docs/approved-interface-captures/orbit-2026-11-06.json
          CAPTURE_DIR: ${{ runner.temp }}/interface-captures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const approval = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          const signature = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
          for (const file of approval.files) {
            const source = path.join(process.env.CAPTURE_DIR, file.source);
            const bytes = fs.readFileSync(source);
            if (bytes.length !== file.bytes) throw new Error(`Byte-size mismatch for ${file.source}`);
            if (!bytes.subarray(0, 8).equals(signature)) throw new Error(`Invalid PNG signature: ${file.source}`);
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== file.sha256) throw new Error(`SHA-256 mismatch for ${file.source}`);
            const destination = path.resolve(file.destination);
            if (!destination.startsWith(path.resolve('apps/platform/public/interface-captures/orbit') + path.sep)) {
              throw new Error('Destination escaped the approved ORBIT asset directory.');
            }
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(source, destination);
          }
          NODE

      - name: Commit only verified ORBIT captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/public/interface-captures/orbit/orbit-desktop.png apps/platform/public/interface-captures/orbit/orbit-mobile.png
          if git diff --cached --quiet; then
            echo "The approved captures are already present; nothing to publish."
            exit 0
          fi
          git commit -m "docs(portfolio): publish reviewed ORBIT interface captures"
          git push origin HEAD:main
