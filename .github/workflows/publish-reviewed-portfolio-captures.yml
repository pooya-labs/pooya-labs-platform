name: Publish Reviewed Portfolio Captures

on:
  push:
    branches: [main]
    paths:
      - 'docs/approved-interface-captures/portfolio-*.json'
      - '.github/workflows/publish-reviewed-portfolio-captures.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-reviewed-portfolio-captures
  cancel-in-progress: false

jobs:
  publish:
    name: Verify approved artifacts and publish portfolio screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate portfolio approval manifest
        id: approval
        env:
          MANIFEST: docs/approved-interface-captures/portfolio-2026-11-06.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          const allowed = new Set(['pooya-os', 'nexus-canvas', 'lumina-glass', 'aurapulse']);
          const expected = new Set([...allowed].flatMap((project) => ['desktop', 'mobile'].map((device) => project + ':' + device)));
          if (manifest.schemaVersion !== 1 || manifest.scope !== 'portfolio-case-study-interface-captures') {
            throw new Error('Unsupported portfolio capture approval manifest.');
          }
          if (manifest.review?.outcome !== 'approved-for-portfolio-use') {
            throw new Error('Portfolio capture manifest does not authorize publication.');
          }
          if (!Number.isInteger(manifest.artifact?.workflowRunId) || !/^[a-f0-9]{40}$/.test(manifest.artifact.captureSha)) {
            throw new Error('Source artifact run ID or capture SHA is invalid.');
          }
          if (manifest.files?.length !== expected.size) {
            throw new Error('Exactly eight approved desktop/mobile captures are required.');
          }
          const seen = new Set();
          for (const file of manifest.files) {
            const key = file.project + ':' + file.device;
            if (!expected.has(key) || seen.has(key)) throw new Error('Unexpected or duplicate project/device in approval manifest: ' + key);
            if (file.source !== file.project + '-' + file.device + '.png') throw new Error('Source file name mismatch: ' + key);
            if (file.destination !== 'apps/platform/public/interface-captures/' + file.project + '/' + file.source) {
              throw new Error('Destination path is outside the approved project asset directory: ' + key);
            }
            if (!/^[a-f0-9]{64}$/.test(file.sha256) || !Number.isInteger(file.bytes) || file.bytes <= 8) {
              throw new Error('Invalid size or SHA-256 metadata: ' + key);
            }
            const expectedWidth = file.device === 'desktop' ? 1440 : 390;
            const expectedHeight = file.device === 'desktop' ? 1000 : 844;
            if (file.viewport?.width !== expectedWidth || file.viewport?.height !== expectedHeight) {
              throw new Error('Unexpected viewport dimensions: ' + key);
            }
            seen.add(key);
          }
          if (seen.size !== expected.size) throw new Error('One or more approved viewport captures are missing.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${manifest.artifact.workflowRunId}\nartifact_name=${manifest.artifact.name}\n`);
          NODE

      - name: Download the exact reviewed screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ steps.approval.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.approval.outputs.artifact_name }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/interface-captures"

      - name: Verify PNG signatures, dimensions, sizes, and SHA-256
        env:
          MANIFEST: docs/approved-interface-captures/portfolio-2026-11-06.json
          CAPTURE_DIR: ${{ runner.temp }}/interface-captures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          const signature = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
          for (const file of manifest.files) {
            const source = path.join(process.env.CAPTURE_DIR, file.source);
            const bytes = fs.readFileSync(source);
            if (bytes.length !== file.bytes) throw new Error('Byte-size mismatch: ' + file.source);
            if (!bytes.subarray(0, 8).equals(signature)) throw new Error('Invalid PNG signature: ' + file.source);
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== file.sha256) throw new Error('SHA-256 mismatch: ' + file.source);
            const width = bytes.readUInt32BE(16);
            const height = bytes.readUInt32BE(20);
            if (width !== file.viewport.width || height !== file.viewport.height) {
              throw new Error('PNG dimensions do not match the approved viewport: ' + file.source);
            }
            const destination = path.resolve(file.destination);
            if (!destination.startsWith(path.resolve('apps/platform/public/interface-captures') + path.sep)) {
              throw new Error('Destination escaped the public interface-capture directory.');
            }
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(source, destination);
          }
          NODE

      - name: Check GitHub App publisher configuration
        id: publisher_config
        env:
          APP_ID: ${{ secrets.CAPTURE_PUBLISHER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CAPTURE_PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Capture publisher PR creation is paused until the repository App secrets are configured."
          fi

      - name: Create least-privilege GitHub App installation token
        if: steps.publisher_config.outputs.configured == 'true'
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CAPTURE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.CAPTURE_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pooya-labs-platform
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update a reviewable publication PR
        if: steps.publisher_config.outputs.configured == 'true'
        id: pull_request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: automation/publish-reviewed-portfolio-captures
          base: main
          delete-branch: true
          title: "Publish reviewed project interface captures"
          commit-message: "docs(portfolio): propose reviewed project interface captures"
          body: |
            This PR was generated from the checked-in owner-approved capture manifest.
            The source run, PNG signatures, dimensions (where applicable), byte sizes, and SHA-256 digests were verified before these files were staged.
            Review the generated diff and require Repository CI plus Portfolio Browser QA before merging. This workflow never pushes directly to main.
          add-paths: |
            apps/platform/public/interface-captures/pooya-os/pooya-os-desktop.png
            apps/platform/public/interface-captures/pooya-os/pooya-os-mobile.png
            apps/platform/public/interface-captures/nexus-canvas/nexus-canvas-desktop.png
            apps/platform/public/interface-captures/nexus-canvas/nexus-canvas-mobile.png
            apps/platform/public/interface-captures/lumina-glass/lumina-glass-desktop.png
            apps/platform/public/interface-captures/lumina-glass/lumina-glass-mobile.png
            apps/platform/public/interface-captures/aurapulse/aurapulse-desktop.png
            apps/platform/public/interface-captures/aurapulse/aurapulse-mobile.png

      - name: Record missing publisher setup
        if: steps.publisher_config.outputs.configured != 'true'
        run: |
          {
            echo "## Capture publisher paused"
            echo "The approval and artifact-integrity checks passed, but PR creation requires repository secrets CAPTURE_PUBLISHER_APP_ID and CAPTURE_PUBLISHER_APP_PRIVATE_KEY."
            echo "No image files were published or pushed to main."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize publication PR
        if: steps.publisher_config.outputs.configured == 'true'
        env:
          PR_URL: ${{ steps.pull_request.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Review PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No publication diff was required; approved captures already match main." >> "$GITHUB_STEP_SUMMARY"
          fi
