name: Project Interface Captures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/platform/scripts/capture-project-previews.mjs'
      - 'apps/platform/package.json'
      - 'package.json'
      - '.github/workflows/project-interface-captures.yml'

permissions:
  contents: read

concurrency:
  group: project-interface-captures
  cancel-in-progress: true

jobs:
  capture:
    name: Capture public project previews
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop and mobile previews
        run: npm run capture:projects --workspace @pooya-labs/platform

      - name: Upload unreviewed screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-interface-captures
          path: apps/platform/artifacts/project-interface-captures/
          if-no-files-found: error
          retention-days: 14
