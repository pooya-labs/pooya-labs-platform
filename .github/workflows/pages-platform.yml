name: Platform GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/platform/**'
      - 'package.json'
      - '.github/workflows/pages-platform.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: platform-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build platform preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check platform
        run: npm run typecheck
      - name: Build static Pages bundle
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    name: Deploy platform preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
